# nginx rodando como www-data (sem root): pid e temporarios em /tmp, porta 8080.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    server_tokens off;

    # Sem query string no log (evita vazar tokens em URL); rid = correlacao com o request_id da API.
    log_format frete '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                     '$request_time rid=$request_id';
    access_log /dev/stdout frete;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Limites de entrada. O limite fino (ex.: webhooks menores) e aplicado na aplicacao.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;

        # Erros gerados pelo proprio nginx tambem saem em JSON.
        error_page 400 = @erro_400;
        error_page 404 = @erro_404;
        error_page 413 = @erro_413;
        error_page 502 503 504 = @erro_5xx;

        location @erro_400 { internal; default_type application/json; add_header X-Content-Type-Options "nosniff" always; return 400 '{"erro":{"codigo":"requisicao_invalida","mensagem":"Requisicao invalida."}}'; }
        location @erro_404 { internal; default_type application/json; add_header X-Content-Type-Options "nosniff" always; return 404 '{"erro":{"codigo":"nao_encontrado","mensagem":"Recurso nao encontrado."}}'; }
        location @erro_413 { internal; default_type application/json; add_header X-Content-Type-Options "nosniff" always; return 413 '{"erro":{"codigo":"payload_muito_grande","mensagem":"Corpo da requisicao excede o limite."}}'; }
        location @erro_5xx { internal; default_type application/json; return 503 '{"erro":{"codigo":"indisponivel","mensagem":"Servico temporariamente indisponivel."}}'; }

        # Status do php-fpm: somente de dentro do container (ex.: HEALTHCHECK/diagnostico).
        location ~ ^/(fpm-status|fpm-ping)$ {
            allow 127.0.0.1;
            deny all;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_NAME $uri;
            fastcgi_param SCRIPT_FILENAME $uri;
            fastcgi_pass 127.0.0.1:9000;
        }

        # API pura: todo request vai para o front controller. Nada de servir arquivos estaticos.
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            # request_id gerado pelo nginx (nao confia no que o cliente manda).
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_hide_header X-Powered-By;
            fastcgi_connect_timeout 2s;
            # Maior que o request_terminate_timeout do php-fpm (20s).
            fastcgi_read_timeout 25s;
            fastcgi_send_timeout 25s;
        }

        location ~ /\. { return 404; }
    }
}
