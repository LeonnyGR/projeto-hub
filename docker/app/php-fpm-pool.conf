; Carregado como php-fpm.d/zz-www.conf (os pools/confs padrao da imagem foram removidos no Dockerfile).
[global]
daemonize = no
; stderr do container (nao ha diretorio de log gravavel/persistente)
error_log = /proc/self/fd/2

[www]
; Roda como www-data porque o container inteiro roda como www-data (sem user/group aqui).
listen = 127.0.0.1:9000

; --- Dimensionamento para ~1 GB de RAM -----------------------------------------------
;   reservado p/ nginx + supervisord + opcache (128M) + SO/overhead ........ ~256 MB
;   disponivel para workers ................................................ 1024 - 256 = 768 MB
;   consumo medio de um worker Laravel (RSS, c/ opcache compartilhado) ..... ~45 MB
;   max_children = 768 / 45 = 17,06  ->  16 (margem para picos de memory_limit)
; pm = static: sem custo de fork sob carga e consumo de memoria previsivel.
pm = static
pm.max_children = 16
; Recicla o worker a cada 500 requests (mitiga vazamento de memoria).
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Maior que o timeout total de uma cotacao (3 s por transportadora em paralelo + banco + overhead).
; max_execution_time (php.ini) e o limite "macio"; este e o "duro" (mata o worker).
request_terminate_timeout = 20s

; Laravel le a configuracao do ambiente do processo (nao ha .env na imagem).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
