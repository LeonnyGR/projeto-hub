; supervisord sem root: sem socket de controle, logs de cada processo vao para stdout/stderr do container.
[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
loglevel = warn

[program:php-fpm]
command = php-fpm -F
priority = 10
autorestart = true
startsecs = 2
stopsignal = QUIT
stopwaitsecs = 25
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autorestart = true
startsecs = 2
stopsignal = QUIT
stopwaitsecs = 25
stdout_logfile = /dev/fd/1
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/fd/2
stderr_logfile_maxbytes = 0
