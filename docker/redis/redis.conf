# Redis do frete-hub: fila, cache, circuit breaker, rate limit e locks de idempotencia.
# O entrypoint gera /etc/redis-runtime/redis-runtime.conf (requirepass vindo de REDIS_PASSWORD + bind do IP da rede).

# --- Rede -----------------------------------------------------------------------------------
# So loopback por padrao; o entrypoint acrescenta o IP do container na rede frete-net.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# --- Persistencia: AOF (fila nao pode se perder em restart) -----------------------------------
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 3600 1
dir /data

# --- Memoria ------------------------------------------------------------------------------------
maxmemory 256mb
# Remove so chaves COM TTL (cache, locks, estado do breaker). Filas e jobs nao tem TTL e nunca
# sao despejados; se a memoria encher de chaves sem TTL, escritas falham (preferivel a perder jobs).
maxmemory-policy volatile-lru
maxclients 1000

# --- Logs ---------------------------------------------------------------------------------------
loglevel notice
logfile ""

# --- Comandos perigosos desabilitados -------------------------------------------------------------
# (FLUSHDB segue habilitado: Cache::flush()/cache:clear do Laravel depende dele.)
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""

# Arquivo gerado no start (segredo e IP). Tem que ser a ultima linha.
include /etc/redis-runtime/redis-runtime.conf
